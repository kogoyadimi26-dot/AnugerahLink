<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" font-family="Inter, system-ui, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker></defs>
<rect width="1400" height="820" fill="#FBF8F1"/>
<text x="40" y="45" font-size="30" font-weight="800" fill="#003C18">AnugerahLink: siklus bisnis yang berulang</text>
<text x="40" y="760" font-size="14" fill="#555">Garis tebal: kopi dan uang bergerak. Garis putus-putus: informasi kembali ke petani. Langkah verifikasi dan terbitkan dilakukan oleh orang yang berbeda.</text>
