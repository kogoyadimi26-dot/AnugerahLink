<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnugerahLink: UI prototype</title>
<style>
/* Tokens from docs/app/DESIGN.md */
:root{--bg:#FAF7F2;--surface:#FFFFFF;--ink:#2A211B;--ink-muted:#6B5D52;--line:#E6DDD2;--brand:#5B3A24;--brand-ink:#FFFFFF;--accent:#2F6B4F;--warn:#9A5B00;--danger:#A3262B;--radius:10px;--radius-sm:8px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1714;--surface:#27211C;--ink:#F3ECE3;--ink-muted:#B5A697;--line:#3E342C;--brand:#D9A66B;--brand-ink:#1B1714;--accent:#7FC4A0;--warn:#F0B45A;--danger:#F08A8D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1B1714;--surface:#27211C;--ink:#F3ECE3;--ink-muted:#B5A697;--line:#3E342C;--brand:#D9A66B;--brand-ink:#1B1714;--accent:#7FC4A0;--warn:#F0B45A;--danger:#F08A8D;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;overflow-x:hidden}
a{color:var(--brand)}
h1{font-size:28px;line-height:1.2;margin:0 0 12px}
h2{font-size:22px;line-height:1.2;margin:24px 0 12px}
h3{font-size:18px;line-height:1.2;margin:0 0 8px}
p{margin:0 0 12px}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.muted{color:var(--ink-muted)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 16px;max-width:1120px;margin:0 auto}
.logo{display:flex;align-items:center;text-decoration:none}
.logo img{height:56px;width:auto;display:block}
nav.main{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
nav.main a{text-decoration:none;color:var(--ink);min-height:44px;display:inline-flex;align-items:center}
.badge{display:inline-block;min-width:22px;padding:0 6px;border-radius:11px;background:var(--brand);color:var(--brand-ink);font-size:13px;text-align:center;margin-left:4px}
main{padding:24px 0 48px;min-height:70vh}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:640px){.grid.lots{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(3,1fr)}.form-grid{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.grid.lots{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(4,1fr)}}
.steps{display:grid;gap:16px;grid-template-columns:1fr}
.stats{display:grid;gap:16px;grid-template-columns:repeat(2,1fr)}
.form-grid{display:grid;gap:0 16px;grid-template-columns:1fr}
.form-grid .wide{grid-column:1/-1}
.hero{padding:24px 0 8px}
.lead{font-size:18px;color:var(--ink-muted);max-width:60ch}
.tier{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.tier::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.t-reserve{color:var(--brand)}.t-premium{color:var(--accent)}.t-verified{color:var(--ink-muted)}.t-local{color:var(--warn)}
.pill{display:inline-block;font-size:13px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.pill.warn{color:var(--warn);border-color:var(--warn)}.pill.ok{color:var(--accent);border-color:var(--accent)}.pill.bad{color:var(--danger);border-color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.secondary{background:transparent;color:var(--brand)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.small{min-height:36px;padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.lot{display:flex;flex-direction:column;gap:8px}
.code{font-size:13px;color:var(--ink-muted)}
.price{font-size:20px;font-weight:700}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-weight:600}
.help{font-size:13px;color:var(--ink-muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);min-height:44px;padding:8px 10px;width:100%;max-width:100%}
textarea{min-height:88px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper input{width:120px;text-align:center}
.stepper button{width:44px;height:44px;font-size:20px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600}
td.num,th.num{text-align:right}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}
.kv dt{color:var(--ink-muted)}.kv dd{margin:0}
.timeline{list-style:none;padding:0;margin:0}
.timeline li{padding:8px 0 8px 22px;position:relative;border-left:2px solid var(--line);margin-left:6px}
.timeline li::before{content:"";position:absolute;left:-7px;top:14px;width:12px;height:12px;border-radius:50%;background:var(--line)}
.timeline li.done::before{background:var(--accent)}
.timeline li.current{font-weight:700}.timeline li.current::before{background:var(--brand)}
.notice{border-left:4px solid var(--warn);background:var(--surface);padding:12px 16px;border-radius:var(--radius-sm);margin-bottom:16px}
.notice.ok{border-color:var(--accent)}.notice.bad{border-color:var(--danger)}
.hash{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;word-break:break-all}
.demo{font-size:13px;color:var(--warn)}
.sum td{padding:8px 0;border-bottom:1px solid var(--line)}
.sum tr.total td{font-weight:700;font-size:18px;border-bottom:none;padding-top:12px}
.toast{position:fixed;left:16px;right:16px;bottom:16px;max-width:480px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:var(--radius-sm);z-index:20}
.proto-banner{background:var(--surface);border-bottom:1px dashed var(--warn);color:var(--warn);font-size:13px;text-align:center;padding:6px 12px}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--ink-muted);font-size:14px;background:var(--surface)}
</style>
</head>
<body>
<div class="proto-banner">Clickable UI prototype with sample data. Nothing is saved or sent. The working app is in <code>server.js</code>.</div>

  function view(html) { main.innerHTML = html; main.focus({ preventScroll: true }); window.scrollTo(0, 0); }
  const available = (l) => l.kg;

  function lotCard(l) {
    const t = TIERS[l.tier];
    return `<article class="card lot" aria-labelledby="h-${l.code}">
      <div class="row between"><span class="${tierClass(l.tier)}">${esc(t.label)}</span><span class="code">${esc(l.code)}</span></div>
      <h3 id="h-${l.code}"><a href="#/lot/${l.code}" style="color:inherit;text-decoration:none">Cup ${l.cup} · ${esc(l.region)}</a></h3>
      <p class="muted" style="font-size:14px">${esc(l.group)} · ${esc(l.process)} · ${esc(l.grade)}</p>
      <p class="price num">${money(t.price)} <span class="muted" style="font-size:14px;font-weight:400">per kg</span></p>
      <p class="muted" style="font-size:14px">${esc(t.ship)}</p>
      <div class="row">${l.kg < 60 ? '<span class="pill warn">Low stock</span>' : ""}<span class="pill">${kg(l.kg)} in stock</span></div>
      <div class="row" style="margin-top:auto"><a class="btn secondary small" href="#/lot/${l.code}">View lot</a><a class="btn secondary small" href="#/passport/${l.code}">Passport</a></div>
    </article>`;
  }

  function home() {
    view(`
      <section class="hero">
        <h1>Verified Papuan coffee, bought directly from farmer groups.</h1>
        <p class="lead">Every lot is graded before it is listed, traced to the farmer group it came from, and sold with its passport. Farmers are paid in cash at the farm gate.</p>
        <div class="row"><a class="btn" href="#/catalogue">Browse lots in stock</a><a class="btn secondary" href="#/about">How it works</a></div>
      </section>
      <h2>How it works</h2>
      <div class="steps">
        <div class="card"><h3>1. Bought</h3><p>Our field team buys from farmer groups in cash, at a published price.</p></div>
        <div class="card"><h3>2. Graded</h3><p>Our grader cups every lot and sets its grade, cup score and tier before it is listed.</p></div>
        <div class="card"><h3>3. Traced</h3><p>Each lot has a passport showing its region, group, harvest and the price paid.</p></div>
      </div>
      <h2>The four tiers</h2>
      <div class="steps">${Object.entries(TIERS).map(([k, t]) => `<div class="card"><span class="${tierClass(k)}">${esc(t.label)}</span><p class="price num" style="margin-top:8px">${money(t.price)} <span class="muted" style="font-size:14px;font-weight:400">per kg</span></p><p class="muted" style="font-size:14px">${esc(t.desc)}</p></div>`).join("")}</div>
      <h2>Lots in stock now</h2>
      <div class="grid lots">${LOTS.slice(0, 3).map(lotCard).join("")}</div>
    `);
  }

  function catalogue() {
    const tier = (location.hash.split("tier=")[1] || "").split("&")[0];
    const list = LOTS.filter((l) => !tier || l.tier === tier).sort((a, b) => b.cup - a.cup);
    view(`
      <h1>Catalogue</h1>
      <p class="muted">Every lot is graded and verified before it is listed.</p>
      <form class="card row" style="margin:16px 0" aria-label="Filter lots">
        <div class="field" style="margin:0;min-width:180px;flex:1"><label for="ftier">Tier</label>
          <select id="ftier"><option value="">All tiers</option>${Object.entries(TIERS).map(([k, t]) => `<option value="${k}" ${tier === k ? "selected" : ""}>${esc(t.label)}</option>`).join("")}</select></div>
        <div class="field" style="margin:0;min-width:180px;flex:1"><label for="fsort">Sort by</label>
          <select id="fsort"><option>Cup score, high to low</option><option>Price, low to high</option><option>Harvest, newest first</option></select></div>
      </form>
      <p class="muted" role="status">${list.length} lots in stock</p>
      <div class="grid lots">${list.map(lotCard).join("")}</div>`);
    $("#ftier").addEventListener("change", (e) => (location.hash = "#/catalogue" + (e.target.value ? "?tier=" + e.target.value : "")));
  }

  function lot(code) {
    const l = LOTS.find((x) => x.code === code);
    if (!l) return notFound();
    const t = TIERS[l.tier];
    view(`
      <nav class="muted" style="font-size:14px"><a href="#/catalogue">Catalogue</a> / ${esc(l.code)}</nav>
      <article class="card" style="margin-top:12px;max-width:720px">
        <div class="row between"><span class="${tierClass(l.tier)}">${esc(t.label)}</span><span class="code">${esc(l.code)}</span></div>
        <h1 style="margin-top:12px">Cup ${l.cup} · ${esc(l.region)}</h1>
        <p class="muted">${esc(t.desc)}</p>
        <dl class="kv" style="margin:16px 0">
          <dt>Farmer group</dt><dd>${esc(l.group)}</dd><dt>Process</dt><dd>${esc(l.process)}</dd>
          <dt>Grade</dt><dd>${esc(l.grade)}</dd><dt>Harvest</dt><dd>${esc(l.harvest)}</dd>
          <dt>In stock</dt><dd>${kg(l.kg)}</dd>
        </dl>
        <p class="price num" style="font-size:24px">${money(t.price)} <span class="muted" style="font-size:15px;font-weight:400">per kg</span></p>
        <p class="muted" style="font-size:14px">${esc(t.ship)}. Minimum order 30 kg.</p>
        <form id="add" style="margin-top:16px">
          <div class="field"><label for="kgIn">Quantity (kg)</label>
            <div class="stepper"><button type="button" class="btn secondary" data-step="-1" aria-label="Less">−</button>
            <input id="kgIn" type="number" min="30" max="${l.kg}" step="1" value="30" inputmode="numeric">
            <button type="button" class="btn secondary" data-step="1" aria-label="More">+</button></div>
            <p class="help">Minimum 30 kg, in steps of 1 kg. Up to ${kg(l.kg)}.</p>
            <p class="notice bad" id="kgErr" hidden></p></div>
          <div class="row"><button class="btn" type="submit">Add to cart</button><a class="btn secondary" href="#/passport/${l.code}">View passport</a></div>
        </form>
      </article>`);
    const input = $("#kgIn");
    main.querySelectorAll("[data-step]").forEach((b) => b.addEventListener("click", () => (input.value = Math.max(0, +input.value + 10 * +b.dataset.step))));
    $("#add").addEventListener("submit", (e) => {
      e.preventDefault();
      const n = +input.value; const err = $("#kgErr");
      let msg = null;
      if (!Number.isInteger(n)) msg = "Enter a whole number of kg.";
      else if (n < 30) msg = "Minimum order is 30 kg.";
      else if (n > l.kg) msg = "Only " + l.kg + " kg left.";
      if (msg) { err.hidden = false; err.textContent = "Error: " + msg; input.setAttribute("aria-invalid", "true"); return; }
      const i = cart.findIndex((x) => x.code === l.code);
      if (i >= 0) cart[i].kg = n; else cart.push({ code: l.code, kg: n });
      setCount(); toast(l.code + ": " + n + " kg in your cart"); location.hash = "#/cart";
    });
  }

  function passport(code) {
    const l = LOTS.find((x) => x.code === code);
    if (!l) return notFound();
    const t = TIERS[l.tier];
    const hash = "9f3c2a7e" + code.replace(/\D/g, "") + "b41d0c5a8e77f29306d1c4ab52e8f0917d3a6c48e2f5b0d19a7c3e6f8b2d4a1";
    view(`
      <nav class="muted" style="font-size:14px"><a href="#/catalogue">Catalogue</a> / Passport</nav>
      <h1 style="margin-top:12px">Lot passport: ${esc(l.code)}</h1>
      <p class="muted">A verified record of where this lot came from and how it was graded.</p>
      <p class="demo">Sample lot for demonstration.</p>
      <div class="grid">
        <section class="card"><h2 style="margin-top:0">Origin</h2><dl class="kv"><dt>Region</dt><dd>${esc(l.region)}</dd><dt>Farmer group</dt><dd>${esc(l.group)}</dd><dt>Harvest</dt><dd>${esc(l.harvest)}</dd><dt>Process</dt><dd>${esc(l.process)}</dd></dl></section>
        <section class="card"><h2 style="margin-top:0">Grading</h2><dl class="kv"><dt>Grade</dt><dd>${esc(l.grade)}</dd><dt>Cup score</dt><dd>${l.cup}</dd><dt>Moisture</dt><dd>${l.moist}%</dd><dt>Tier</dt><dd><span class="${tierClass(l.tier)}">${esc(t.label)}</span></dd><dt>Kg received</dt><dd>${kg(l.kgIn)}</dd><dt>Farm-gate price paid</dt><dd>${money(l.buy)} per kg</dd></dl></section>
        <section class="card"><h2 style="margin-top:0">Record check</h2>
          <p class="notice ok">Verified record. The fields on this page match the hash recorded when the lot was published.</p>
          <p class="muted">The hash is computed from the fields above. If any of them changes after publishing, the hash changes. This shows change; it does not by itself prove that no change was ever made.</p>
          <p class="muted">Record hash (SHA-256)</p><p class="hash">${hash}</p></section>
      </div>
      <div class="row" style="margin-top:16px"><a class="btn" href="#/lot/${l.code}">Buy this lot</a><a class="btn secondary" href="#/catalogue">Back to catalogue</a></div>`);
  }

  function cartView() {
    if (!cart.length) {
      return view(`<h1>Your cart</h1><div class="card"><p>Your cart is empty.</p><p><a class="btn" href="#/catalogue">Browse lots</a></p></div>`);
    }
    const lines = cart.map((c) => { const l = LOTS.find((x) => x.code === c.code); const t = TIERS[l.tier]; return { ...c, l, t, sub: c.kg * t.price, ship: l.tier === "verified" ? c.kg * 20000 : 0 }; });
    const sub = lines.reduce((a, x) => a + x.sub, 0), ship = lines.reduce((a, x) => a + x.ship, 0);
    view(`
      <h1>Your cart</h1>
      <div class="table-wrap"><table>
        <thead><tr><th>Lot</th><th>Tier</th><th class="num">Kg</th><th class="num">Price per kg</th><th class="num">Line total</th><th></th></tr></thead>
        <tbody>${lines.map((x) => `<tr><td><a href="#/lot/${x.code}">${esc(x.code)}</a></td><td><span class="${tierClass(x.l.tier)}">${esc(x.t.label)}</span></td><td class="num">${kg(x.kg)}</td><td class="num">${money(x.t.price)}</td><td class="num">${money(x.sub)}${x.ship ? `<br><span class="muted" style="font-size:13px">+ ${money(x.ship)} shipping</span>` : ""}</td><td><button class="btn danger small" data-rm="${x.code}">Remove</button></td></tr>`).join("")}</tbody>
      </table></div>
      <div class="card" style="margin-top:16px;max-width:420px;margin-left:auto">
        <table class="sum"><tbody>
          <tr><td>Subtotal</td><td class="num">${money(sub)}</td></tr>
          <tr><td>Shipping</td><td class="num">${ship ? money(ship) : "Included or collected"}</td></tr>
          <tr class="total"><td>Total</td><td class="num">${money(sub + ship)}</td></tr>
        </tbody></table>
        <p class="muted" style="font-size:14px">Payment is by bank transfer against an invoice.</p>
        <div class="row"><a class="btn" href="#/checkout">Go to checkout</a><a class="btn secondary" href="#/catalogue">Keep shopping</a></div>
      </div>`);
    main.querySelectorAll("[data-rm]").forEach((b) => b.addEventListener("click", () => {
      cart.splice(cart.findIndex((x) => x.code === b.dataset.rm), 1); setCount(); cartView();
    }));
  }

  function checkout() {
    if (!cart.length) { location.hash = "#/cart"; return; }
    view(`
      <h1>Checkout</h1>
      <p class="muted">AnugerahLink sells to business buyers: cafes, roasters and businesses. Payment is by bank transfer against an invoice.</p>
      <form id="co" class="card" novalidate>
        <h2 style="margin-top:0">Buyer</h2>
        <div class="form-grid">
          <div class="field"><label for="bt">Buyer type</label><select id="bt"><option>Specialty cafe</option><option>Premium roaster</option><option>Roaster</option><option>Cafe or business in Papua</option><option>Other</option></select></div>
          <div class="field"><label for="cc">Company or cafe name</label><input id="cc"></div>
          <div class="field"><label for="cn">Contact name <span class="muted">(required)</span></label><input id="cn" required></div>
          <div class="field"><label for="cp">Phone <span class="muted">(required)</span></label><input id="cp" type="tel" required><p class="help">Include the country code if outside Indonesia.</p></div>
          <div class="field wide"><label for="ce">Email <span class="muted">(required)</span></label><input id="ce" type="email" required><p class="help">Used for order updates and tracking.</p></div>
        </div>
        <h2>Delivery</h2>
        <div class="form-grid">
          <div class="field"><label for="city">Delivery city <span class="muted">(required)</span></label><input id="city" required></div>
          <div class="field wide"><label for="notes">Notes for the team</label><textarea id="notes"></textarea></div>
        </div>
        <div class="row"><button class="btn" type="submit">Place order</button><a class="btn secondary" href="#/cart">Back to cart</a></div>
      </form>`);
    $("#co").addEventListener("submit", (e) => {
      e.preventDefault();
      const f = e.target;
      const bad = [...f.querySelectorAll("[required]")].find((el) => !el.value.trim());
      if (bad) { bad.setAttribute("aria-invalid", "true"); bad.focus(); toast("Please fill in the required fields."); return; }
      const number = "ALO-2611-" + String(ORDERS.length + 1).padStart(3, "0");
      ORDERS.unshift({ number, status: "requested", buyer: $("#cn").value, company: $("#cc").value, email: $("#ce").value, total: cart.reduce((a, c) => a + c.kg * TIERS[LOTS.find((x) => x.code === c.code).tier].price, 0), lines: cart.map((c) => ({ code: c.code, kg: c.kg, tier: LOTS.find((x) => x.code === c.code).tier })), timeline: { requested: new Date().toISOString().slice(0, 10) } });
      cart.length = 0; setCount();
      location.hash = "#/track/" + number;
    });
  }

  function track(number) {
    if (!number) {
      return view(`
        <h1>Track your order</h1>
        <form class="card" style="max-width:520px" id="tr">
          <div class="field"><label for="tn">Order number</label><input id="tn" placeholder="ALO-2611-001" required></div>
          <div class="field"><label for="te">Email used for the order</label><input id="te" type="email" required></div>
          <button class="btn" type="submit">Show order</button>
        </form>`) || $("#tr").addEventListener("submit", (e) => { e.preventDefault(); location.hash = "#/track/" + $("#tn").value.trim(); });
    }
    const o = ORDERS.find((x) => x.number === number);
    if (!o) return notFound("No order matches that number.");
    const steps = ["requested", "confirmed", "paid", "shipped", "delivered", "completed"];
    const cur = steps.indexOf(o.status);
    const total = o.total;
    view(`
      <nav class="muted" style="font-size:14px"><a href="#/track">Track order</a> / ${esc(o.number)}</nav>
      <h1 style="margin-top:12px">Order ${esc(o.number)}</h1>
      <p><span class="pill ok">${esc(o.status.charAt(0).toUpperCase() + o.status.slice(1))}</span></p>
      <div class="grid">
        <section class="card"><h2 style="margin-top:0">Status</h2>
          <ol class="timeline">${steps.map((s, i) => `<li class="${i < cur ? "done" : ""} ${i === cur ? "current" : ""}">${s.charAt(0).toUpperCase() + s.slice(1)}${o.timeline[s] ? ` · <span class="muted">${o.timeline[s]}</span>` : ""}</li>`).join("")}</ol></section>
        <section class="card"><h2 style="margin-top:0">Items</h2>
          <div class="table-wrap"><table><thead><tr><th>Lot</th><th>Tier</th><th class="num">Kg</th></tr></thead><tbody>${o.lines.map((l) => `<tr><td>${l.code}</td><td><span class="${tierClass(l.tier)}">${TIERS[l.tier].label}</span></td><td class="num">${kg(l.kg)}</td></tr>`).join("")}</tbody></table></div>
          <p style="margin-top:12px"><strong>Total ${money(total)}</strong></p></section>
      </div>
      ${o.status === "delivered" ? `<div class="card" style="margin-top:16px"><h3>Your delivery</h3><p>Confirm receipt once the coffee has arrived and you have checked it. This opens feedback.</p><button class="btn" id="rc">I have received this order</button></div>` : ""}`);
    const rc = $("#rc");
    if (rc) rc.addEventListener("click", () => { o.status = "completed"; o.timeline.completed = new Date().toISOString().slice(0, 10); toast("Receipt confirmed. Thank you."); track(o.number); });
  }

  function about() {
    view(`
      <h1>About AnugerahLink</h1>
      <p class="lead">AnugerahLink buys coffee from farmer groups in the Papua highlands, grades every lot, and sells it with a passport that shows where it came from.</p>
      <div class="grid" style="margin-top:16px">
        <section class="card"><h2 style="margin-top:0">How farmers are paid</h2><p>We buy in cash at the farm gate, at a published price.</p></section>
        <section class="card"><h2 style="margin-top:0">Claims and returns</h2><p class="notice">Draft. These terms are pending owner approval and are not yet in effect.</p><p>Report a problem within 48 hours of delivery, with a description and photos of the bags and a sample. The team reviews each claim and offers a replacement, a credit, or a refund of the disputed lines.</p></section>
      </div>`);
  }

  function admin() {
    const kgTotal = LOTS.reduce((a, l) => a + l.kg, 0);
    view(`
      <div class="row between"><h1 style="margin:0">Back office</h1><span class="muted">Sample data</span></div>
      <nav class="row" style="margin:12px 0 16px"><a class="btn small">Dashboard</a><a class="btn secondary small" href="#/admin/orders">Orders</a><a class="btn secondary small" href="#/admin/lots">Lots</a><a class="btn secondary small" href="#/admin/feedback">Feedback</a></nav>
      <div class="stats">
        <div class="card"><div class="muted" style="font-size:13px">Kg in stock</div><div class="num" style="font-size:26px;font-weight:700">${kg(kgTotal)}</div></div>
        <div class="card"><div class="muted" style="font-size:13px">Open orders</div><div class="num" style="font-size:26px;font-weight:700">${ORDERS.filter((o) => o.status !== "completed").length}</div></div>
        <div class="card"><div class="muted" style="font-size:13px">Open order value</div><div class="num" style="font-size:26px;font-weight:700">${money(ORDERS.reduce((a, o) => a + o.total, 0))}</div></div>
        <div class="card"><div class="muted" style="font-size:13px">Break-even</div><div class="num" style="font-size:26px;font-weight:700">11,800 kg/yr</div></div>
      </div>
      <h2>Economics per kg bought</h2>
      <div class="table-wrap"><table><tbody>
        <tr><td>Sales</td><td class="num">Rp 161.500</td></tr>
        <tr><td>Paid to farmers</td><td class="num">Rp 120.000</td></tr>
        <tr><td>Shipping paid by AnugerahLink</td><td class="num">Rp 5.700</td></tr>
        <tr><td>Fees: samples, claims, payment</td><td class="num">Rp 1.900</td></tr>
        <tr><th>Gross margin</th><th class="num">Rp 33.900 (21%)</th></tr>
      </tbody></table></div>
      <p class="muted" style="font-size:14px;margin-top:8px">Figures follow the v2 plan. Grade mix is the assumed default until stock exists.</p>`);
  }

  function adminOrders() {
    view(`
      <h1>Orders</h1>
      <div class="table-wrap"><table>
        <thead><tr><th>Order</th><th>Buyer</th><th>Status</th><th class="num">Total</th></tr></thead>
        <tbody>${ORDERS.map((o) => `<tr><td>${esc(o.number)}</td><td>${esc(o.buyer)}<br><span class="muted" style="font-size:13px">${esc(o.company)} · ${esc(o.email)}</span></td><td><span class="pill">${esc(o.status)}</span></td><td class="num">${money(o.total)}</td></tr>`).join("")}</tbody>
      </table></div>
      <p class="muted" style="font-size:14px;margin-top:8px">Status changes, payment references and problem reports are handled here in the working app.</p>`);
  }

  function adminLots() {
    view(`
      <h1>Lots</h1>
      <div class="table-wrap"><table>
        <thead><tr><th>Code</th><th>Group</th><th>Tier</th><th class="num">Cup</th><th class="num">In stock</th></tr></thead>
        <tbody>${LOTS.map((l) => `<tr><td>${l.code}</td><td>${esc(l.group)}</td><td><span class="${tierClass(l.tier)}">${TIERS[l.tier].label}</span></td><td class="num">${l.cup}</td><td class="num">${kg(l.kg)}</td></tr>`).join("")}</tbody>
      </table></div>`);
  }

  function adminFeedback() {
    view(`
      <h1>Feedback</h1>
      <p class="muted">Only items tagged "pass-to-farmer" reach the farmer report. Buyer names and prices never do.</p>
      <div class="card"><h3>Ayu Test, ALO-2611-001</h3><p>Sweet and clean, a little flat after two weeks.</p><p class="muted" style="font-size:14px">Reorder: yes · Issues: none</p>
        <div class="field" style="max-width:280px"><label for="tag">Tag</label><select id="tag"><option>Untagged</option><option>pass-to-farmer</option><option>internal-quality</option><option>internal-logistics</option><option>discard</option></select></div></div>`);
  }

  function notFound(msg) {
    view(`<h1>Page not found</h1><p class="muted">${esc(msg || "This page does not exist in the prototype.")}</p><p><a href="#/">Home</a></p>`);
  }

  function route() {
    const h = location.hash.replace(/^#\/?/, "").split("?")[0];
    const [a, b] = h.split("/");
    setCount();
    if (!h) return home();
    if (a === "catalogue") return catalogue();
    if (a === "lot") return lot(b);
    if (a === "passport") return passport(b);
    if (a === "cart") return cartView();
    if (a === "checkout") return checkout();
    if (a === "track") return track(b);
    if (a === "about") return about();
    if (a === "admin") {
      if (b === "orders") return adminOrders();
      if (b === "lots") return adminLots();
      if (b === "feedback") return adminFeedback();
      return admin();
    }
    notFound();
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
